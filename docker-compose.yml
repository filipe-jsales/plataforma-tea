services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma-tea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plataforma_tea
      POSTGRES_PASSWORD: plataforma_tea
      POSTGRES_DB: plataforma_tea
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
